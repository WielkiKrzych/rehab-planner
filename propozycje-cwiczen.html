hologies:["achilles","plantar-fasciitis"],phases:[2,3],maxPain:5,tempo:"4-0-1-0",dosage:{sets:3,reps:15}},"ankle-eversion":{pathologies:["ankle-sprain"],phases:[1,2],maxPain:6,tempo:"2-0-2-0"},"resisted-ankle-inversion":{pathologies:["ankle-sprain"],phases:[2],maxPain:5,tempo:"2-0-2-0"},"foam-rolling-calves":{pathologies:["achilles","plantar-fasciitis"],phases:[1,2,3],maxPain:7},"wrist-circles":{pathologies:["wrist-sprain","cts","lateral-epi","medial-epi"],phases:[1],maxPain:7},"wrist-flexor-stretch":{pathologies:["medial-epi","cts","wrist-sprain"],phases:[1,2,3],maxPain:6},"wrist-extensor-stretch":{pathologies:["lateral-epi","wrist-sprain"],phases:[1,2,3],maxPain:6},"wrist-curls":{pathologies:["medial-epi","wrist-sprain"],phases:[2,3],maxPain:4,tempo:"3-0-1-0"},"reverse-wrist-curls":{pathologies:["lateral-epi"],phases:[2,3],maxPain:4,tempo:"3-0-1-0"},"grip-squeeze":{pathologies:["wrist-sprain","lateral-epi","cts"],phases:[1,2],maxPain:5},"eccentric-wrist-extension":{pathologies:["lateral-epi"],phases:[2,3],maxPain:5,tempo:"4-0-1-0",dosage:{sets:3,reps:15}},"eccentric-wrist-flexion":{pathologies:["medial-epi"],phases:[2,3],maxPain:5,tempo:"4-0-1-0",dosage:{sets:3,reps:15}},"forearm-pronation-supination":{pathologies:["lateral-epi","medial-epi","post-immob-elbow","wrist-sprain"],phases:[1,2],maxPain:6},"triceps-stretch-overhead":{pathologies:["post-immob-elbow"],phases:[2,3],maxPain:6},"biceps-curl-isometric":{pathologies:["post-immob-elbow","lateral-epi"],phases:[1,2],maxPain:5,dosage:{sets:3,holdSeconds:30}},"elbow-mobilization":{pathologies:["post-immob-elbow"],phases:[1],maxPain:7},"neck-rotation":{pathologies:["neck-pain","cgh"],phases:[1,2],maxPain:7},"neck-side-flexion":{pathologies:["neck-pain"],phases:[1,2],maxPain:7},"chin-tucks":{pathologies:["neck-pain","cgh","upper-cross"],phases:[1,2,3],maxPain:6,dosage:{sets:3,reps:10,holdSeconds:5}},"upper-trap-stretch":{pathologies:["neck-pain","upper-cross","cgh"],phases:[1,2,3],maxPain:6},"levator-scapulae-stretch":{pathologies:["neck-pain","cgh"],phases:[1,2,3],maxPain:6},"neck-isometric-holds":{pathologies:["neck-pain","cgh"],phases:[2,3],maxPain:4,dosage:{sets:3,reps:5,holdSeconds:10}}},d=[{id:"wall-sits",name:"Wall Sits",description:"Przysiady przy ścianie. Stań plecami do ściany, zsuń się w dół aż uda będą równoległe do podłogi. Utrzymaj pozycję, angażując mięśnie czworogłowe. Plecy cały czas przylegają do ściany.",category:"strength",bodyPart:"knee",difficulty:1,duration:30,equipment:[],tags:["quadriceps","izometryczne","początkujący","stabilizacja"]},{id:"straight-leg-raises",name:"Straight Leg Raises",description:"Unoszenie wyprostowanej nogi. Połóż się na plecach, jedną nogę zegnij w kolanie, drugą wyprostuj. Powoli unoś prostą nogę do góry około 30-45 stopni, utrzymaj przez chwilę i opuść. Kontroluj ruch przez cały czas.",category:"strength",bodyPart:"knee",difficulty:1,sets:3,reps:15,equipment:[],tags:["quadriceps","rehabilitacja","początkujący","kontrola"]},{id:"hamstring-curls",name:"Hamstring Curls",description:"Uginanie nóg w pozycji stojącej lub leżącej. Zginaj kolano, przyciągając piętę do pośladka. Ruch powinien być powolny i kontrolowany. Można wykonywać z obciążeniem na kostce.",category:"strength",bodyPart:"knee",difficulty:2,sets:3,reps:12,equipment:[],tags:["mięśnie dwugłowe","tył uda","siła","kontrola"]},{id:"step-ups",name:"Step-ups",description:"Wejścia na stopień. Stań przed stabilnym stopniem lub ławką. Wejdź jedną nogą na stopień, drugą dołącz. Następnie zejdź w dół. Pamiętaj o stabilizacji kolana i prostych plecach.",category:"strength",bodyPart:"knee",difficulty:2,sets:3,reps:10,equipment:["step","bench"],tags:["funkcjonalne","siła","stabilizacja","quadriceps"]},{id:"mini-squats",name:"Mini Squats",description:"Półprzysiady. Wykonaj płytki przysiad, schodząc tylko do około 45 stopni zgięcia w kolanach. Plecy proste, kolana nie mogą schodzić się do środka. Wróć do pozycji stojącej.",category:"strength",bodyPart:"knee",difficulty:2,sets:3,reps:12,equipment:[],tags:["quadriceps","pośladki","częściowy zakres","kontrola"]},{id:"lunges",name:"Lunges",description:"Wykroki. Zrób duży krok w przód, uginając oba kolana pod kątem 90 stopni. Kolano tylnej nogi prawie dotyka podłogi. Wracaj do pozycji wyjściowej i powtórz na drugą nogę.",category:"strength",bodyPart:"knee",difficulty:3,sets:3,reps:10,equipment:[],tags:["funkcjonalne","równowaga","siła","obustronne"]},{id:"pendulum-swings",name:"Pendulum Swings",description:"Wahadłowe ruchy ramienia. Pochyl się w pasie, oprzyj zdrową rękę o stół. Pozwól chorej ręce luźno zwisać i wykonuj delikatne kołyszące ruchy w różnych kierunkach, wykorzystując grawitację.",category:"mobility",bodyPart:"shoulder",difficulty:1,duration:60,equipment:[],tags:["mobilność","pasywne","rehabilitacja","staw barkowy"]},{id:"external-rotation",name:"Rotacja zewnętrzna",description:"Rotacja zewnętrzna z gumą. Przytrzymaj łokieć blisko ciała pod kątem 90 stopni. Przesuń dłoń na zewnątrz, rotując ramię, a następnie powoli wróć. Stabilizuj łokieć przy tułowiu.",category:"strength",bodyPart:"shoulder",difficulty:1,sets:3,reps:15,equipment:["resistance band"],tags:["stożki rotatory","stabilizacja","siła","guma oporowa"]},{id:"internal-rotation",name:"Internal Rotation",description:"Rotacja wewnętrzna z gumą. Przytrzymaj łokieć blisko ciała pod kątem 90 stopni. Przesuń dłoń do wewnątrz, rotując ramię, a następnie powoli wróć. Stabilizuj łokieć przy tułowiu.",category:"strength",bodyPart:"shoulder",difficulty:1,sets:3,reps:15,equipment:["resistance band"],tags:["stożki rotatory","podłopatkowy","siła","guma oporowa"]},{id:"wall-walks",name:"Wall Walks",description:"Chodzenie po ścianie. Stań twarzą do ściany. Palcami jednej ręki przesuwaj po ścianie jak najwyżej, aż poczujesz rozciąganie. Powoli zejdź w dół. Powtórz z drugą ręką.",category:"mobility",bodyPart:"shoulder",difficulty:2,sets:3,reps:10,equipment:[],tags:["zakres ruchu","aktywne","mobilność","stopniowe"]},{id:"shoulder-blade-squeezes",name:"Shoulder Blade Squeezes",description:"Ściąganie łopatek. W pozycji siedzącej lub stojącej, wyprostuj plecy i ściągnij łopatki do siebie jakbyś chciał je zetknąć. Utrzymaj przez 5 sekund, następnie rozluźnij.",category:"strength",bodyPart:"shoulder",difficulty:1,sets:3,reps:15,equipment:[],tags:["stabilizacja","postawa","mięśnie grzbietu","izometryczne"]},{id:"arm-circles",name:"Arm Circles",description:"Krążenia ramion. Wyprostuj ramiona na boki. Wykonuj powolne krążenia w przód, a potem w tył. Utrzymuj kontrolę i nie zginaj łokci. Zacznij od małych kółek, stopniowo zwiększając.",category:"mobility",bodyPart:"shoulder",difficulty:1,duration:30,equipment:[],tags:["rozgrzewka","mobilność","zakres ruchu","kontrola"]},{id:"cat-cow-stretch",name:"Cat-Cow Stretch",description:"Pozycja koci grzbiet-krowa. W klęku podpartym na czworaka, najpierw wygnij kręgosłup w górę, chowając głowę między ramiona (kot). Następnie obniż brzuch, unosząc głowę (krowa). Płynnie przechodź między pozycjami.",category:"stretching",bodyPart:"spine",difficulty:1,sets:1,reps:10,equipment:[],tags:["mobilność","rozciąganie","kręgosłup","oddech"]},{id:"bird-dog",name:"Bird-Dog",description:"Ćwiczenie bird-dog. W klęku podpartym, unoś jednocześnie prawą rękę i lewą nogę, wyprostowując je. Utrzymaj równowagę przez chwilę, potem wróć do pozycji. Powtórz drugą stroną.",category:"strength",bodyPart:"spine",difficulty:2,sets:3,reps:10,equipment:[],tags:["stabilizacja","core","równowaga","mięśnie głębokie"]},{id:"glute-bridge",name:"Glute Bridge",description:"Mostek biodrowy. Połóż się na plecach, nogi ugięte w kolanach, stopy płasko na podłodze. Unieś biodra w górę, napinając pośladki. Utrzymaj górną pozycję, potem opuść biodra.",category:"strength",bodyPart:"spine",difficulty:1,sets:3,reps:15,equipment:[],tags:["pośladki","core","stabilizacja","odciążenie kręgosłupa"]},{id:"pelvic-tilts",name:"Pelvic Tilts",description:"Przodopochylenie i tyłopochylenie miednicy. Leżąc na plecach z ugiętymi kolanami, dociskaj odcinek lędźwiowy do podłogi (tyłopochylenie), potem pozwól naturalnie wygiąć się w łuk (przodopochylenie).",category:"mobility",bodyPart:"spine",difficulty:1,sets:3,reps:15,equipment:[],tags:["lędźwia","mobilność","kontrola","izometryczne"]},{id:"knee-to-chest-stretch",name:"Knee-to-Chest Stretch",description:"Przyciąganie kolana do klatki. Leżąc na plecach, przyciągnij jedno kolano do klatki piersiowej, obejmując je rękami. Utrzymaj rozciąganie w dolnej części pleców. Powtórz drugą nogą.",category:"stretching",bodyPart:"spine",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","lędźwia","mięśnie lędźwiowe","pasywne"]},{id:"trunk-rotation",name:"Trunk Rotation",description:"Rotacja tułowia. Leżąc na plecach, zegnij kolana i pozwól im opaść na jedną stronę, głowę obróć w przeciwnym kierunku. Utrzymaj rozciąganie. Wróć na środek i zmień stronę.",category:"mobility",bodyPart:"spine",difficulty:1,sets:3,reps:10,equipment:[],tags:["rotacja","mobilność","kręgosłup","rozciąganie"]},{id:"clamshells",name:"Clamshells",description:"Skorupki. Połóż się na boku z ugiętymi kolanami. Trzymając stopy złączone, unieś górne kolano w górę jak otwieraną skorupkę. Powoli opuść. Można użyć gumy oporowej na uda.",category:"strength",bodyPart:"hip",difficulty:1,sets:3,reps:15,equipment:[],tags:["pośladkowy średni","stabilizacja biodra","siła","boczne"]},{id:"hip-abduction",name:"Hip Abduction",description:"Odwodzenie biodra. Leżąc na boku, wyprostuj górną nogę. Unieś ją w górę około 30 stopni, prowadząc piętę w stronę sufitu. Powoli opuść. Utrzymaj tułów stabilny.",category:"strength",bodyPart:"hip",difficulty:1,sets:3,reps:15,equipment:[],tags:["pośladkowy średni","odwodzenie","siła","stabilizacja"]},{id:"hip-flexor-stretch",name:"Hip Flexor Stretch",description:"Rozciąganie zginaczy biodra. W pozycji wykopu, jedno kolano na podłodze z tyłu, druga noga z przodu ugięta. Przesuń biodra lekko w przód, czując rozciąganie z przodu biodra tylnej nogi.",category:"stretching",bodyPart:"hip",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","zginacze biodra","mobilność","przód uda"]},{id:"single-leg-glute-bridge",name:"Single Leg Glute Bridge",description:"Jednonóż mostek biodrowy. Leżąc na plecach, jedna noga ugięta, druga wyprostowana w górze. Unieś biodra, napinając pośladki. Utrzymaj pozycję i powoli opuść. Powtórz drugą nogą.",category:"strength",bodyPart:"hip",difficulty:2,sets:3,reps:12,equipment:[],tags:["pośladki","siła","jednonóż","stabilizacja"]},{id:"side-lying-leg-lift",name:"Side-Lying Leg Lift",description:"Unoszenie nogi w leżeniu bocznym. Leżąc na boku, dolna noga lekko ugięta dla stabilizacji. Górną nogę wyprostuj i unieś około 20-30 cm. Powoli opuść, nie pozwalając jej dotknąć dolnej nogi.",category:"strength",bodyPart:"hip",difficulty:1,sets:3,reps:15,equipment:[],tags:["pośladkowy średni","siła","kontrola","izolacja"]},{id:"piriformis-stretch",name:"Piriformis Stretch",description:"Rozciąganie mięśnia gruszkowatego. Leżąc na plecach, połóż kostkę jednej nogi na kolanie drugiej (figura 4). Chwyć udo nogi podporowej i przyciągnij do klatki piersiowej. Czuj rozciąganie w pośladku.",category:"stretching",bodyPart:"hip",difficulty:1,duration:30,equipment:[],tags:["mięsień gruszkowaty","rozciąganie","pośladek","figura 4"]},{id:"ankle-alphabet",name:"Ankle Alphabet",description:'Alfabet kostkowy. Siedząc z uniesioną stopą, "rysuj" alfabet palcami stopy w powietrzu. Ruchy powinny być duże i płynne, angażując cały zakres ruchu w stawie skokowym.',category:"mobility",bodyPart:"ankle",difficulty:1,duration:60,equipment:[],tags:["mobilność","zakres ruchu","rehabilitacja","kontrola"]},{id:"calf-raises",name:"Calf Raises",description:"Wspięcia na palce. Stań za krawędzią stopnia lub płasko na podłodze. Unoś pięty, stając na palcach, napinając łydki. Powoli opuść pięty poniżej poziomu, jeśli jesteś na stopniu.",category:"strength",bodyPart:"ankle",difficulty:1,sets:3,reps:15,equipment:[],tags:["łydki","siła","trójgłowy łydki","wspięcia"]},{id:"single-leg-balance",name:"Single-Leg Balance",description:"Równowaga na jednej nodze. Stań na jednej nodze, drugą lekko ugiętą trzymaj nad ziemią. Utrzymaj równowagę jak najdłużej. Możesz zamknąć oczy dla zwiększenia trudności.",category:"balance",bodyPart:"ankle",difficulty:2,duration:30,equipment:[],tags:["równowaga","propriocepcja","stabilizacja","kontrola"]},{id:"resistance-band-dorsiflexion",name:"Resistance Band Dorsiflexion",description:"Zgięcie grzbietowe z gumą. Siedząc na podłodze z wyprostowaną nogą, zaczep gumę o stopę i przytrzymaj końce. Przyciągaj palce do goleni, pokonując opór gumy.",category:"strength",bodyPart:"ankle",difficulty:1,sets:3,reps:15,equipment:["resistance band"],tags:["zginacze grzbietowe","siła","rehabilitacja","guma oporowa"]},{id:"toe-raises",name:"Toe Raises",description:"Unoszenie palców. Stań płasko na podłodze. Unieś palce stóp w górę, utrzymując pięty na ziemi. Czuj napięcie na przedniej części podudzia. Powoli opuść palce.",category:"strength",bodyPart:"ankle",difficulty:1,sets:3,reps:15,equipment:[],tags:["mięśnie piszczelowe","siła","przednia część podudzia","kontrola"]},{id:"ankle-circles",name:"Ankle Circles",description:"Krążenia kostkami. Siedząc lub leżąc, unoś stopę i wykonuj powolne krążenia w stawie skokowym. Rób koła w obu kierunkach, wykorzystując pełny zakres ruchu.",category:"mobility",bodyPart:"ankle",difficulty:1,sets:1,reps:10,equipment:[],tags:["mobilność","zakres ruchu","krążenia","rozgrzewka"]},{id:"wrist-circles",name:"Wrist Circles",description:"Krążenia nadgarstkami. Spleć palce dłoni i wykonuj krążenia nadgarstkami w obu kierunkach. Ruchy powinny być płynne i obejmować pełny zakres ruchu. Rozluźnij chwyt między powtórzeniami.",category:"mobility",bodyPart:"wrist",difficulty:1,sets:2,reps:15,equipment:[],tags:["mobilność","nadgarstek","rozgrzewka","zakres ruchu"]},{id:"wrist-flexor-stretch",name:"Wrist Flexor Stretch",description:"Rozciąganie zginaczy nadgarstka. Wyprostuj rękę przed siebie, dłoń skierowana do góry. Drugą ręką delikatnie pociągnij palce w dół i do siebie. Utrzymaj rozciąganie, czując napięcie na wewnętrznej stronie przedramienia.",category:"stretching",bodyPart:"wrist",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","zginacze","przedramię","rehabilitacja"]},{id:"wrist-extensor-stretch",name:"Wrist Extensor Stretch",description:"Rozciąganie prostowników nadgarstka. Wyprostuj rękę przed siebie, dłoń skierowana w dół. Drugą ręką delikatnie pociągnij dłoń w stronę ciała. Utrzymaj rozciąganie na zewnętrznej stronie przedramienia.",category:"stretching",bodyPart:"wrist",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","prostowniki","przedramię","łokieć tenisisty"]},{id:"wrist-curls",name:"Wrist Curls",description:"Uginanie nadgarstków. Siedząc, przedramię oprzyj o udo lub ławkę, dłoń skierowana do góry. Z ciężarkiem w dłoni, zginaj nadgarstek w górę i powoli opuszczaj. Ruch tylko w nadgarstku, przedramię nieruchome.",category:"strength",bodyPart:"wrist",difficulty:2,sets:3,reps:15,equipment:["dumbbell"],tags:["siła","zginacze","przedramię","wzmocnienie"]},{id:"reverse-wrist-curls",name:"Reverse Wrist Curls",description:"Prostowanie nadgarstków. Siedząc, przedramię oprzyj o udo lub ławkę, dłoń skierowana w dół. Z ciężarkiem w dłoni, unosz nadgarstek w górę i powoli opuszczaj. Ruch tylko w nadgarstku.",category:"strength",bodyPart:"wrist",difficulty:2,sets:3,reps:15,equipment:["dumbbell"],tags:["siła","prostowniki","przedramię","łokieć tenisisty"]},{id:"grip-squeeze",name:"Grip Squeeze",description:"Ściskanie piłeczki lub expandera. Chwyć piłeczkę antystresową lub grip strengthener w dłoni i mocno ściskaj przez kilka sekund. Powoli rozluźnij uchwyt. Ćwiczenie wzmacnia chwyt i mięśnie dłoni.",category:"strength",bodyPart:"wrist",difficulty:1,sets:3,reps:15,equipment:["stress ball","grip strengthener"],tags:["siła chwytu","mięśnie dłoni","wzmocnienie","rehabilitacja"]},{id:"eccentric-wrist-extension",name:"Eccentric Wrist Extension",description:"Ekscentryczne prostowanie nadgarstka. Z ciężarkiem w dłoni, dłoń skierowana w dół. Drugą ręką pomóż unieść nadgarstek w górę, następnie powoli (3-5 sekund) opuszczaj samodzielnie. Kluczowe ćwiczenie na łokieć tenisisty.",category:"strength",bodyPart:"elbow",difficulty:2,sets:3,reps:10,equipment:["dumbbell"],tags:["ekscentryczne","łokieć tenisisty","prostowniki","rehabilitacja"]},{id:"eccentric-wrist-flexion",name:"Eccentric Wrist Flexion",description:"Ekscentryczne zginanie nadgarstka. Z ciężarkiem w dłoni, dłoń skierowana do góry. Drugą ręką pomóż unieść nadgarstek w górę, następnie powoli (3-5 sekund) opuszczaj samodzielnie. Kluczowe ćwiczenie na łokieć golfisty.",category:"strength",bodyPart:"elbow",difficulty:2,sets:3,reps:10,equipment:["dumbbell"],tags:["ekscentryczne","łokieć golfisty","zginacze","rehabilitacja"]},{id:"forearm-pronation-supination",name:"Forearm Pronation/Supination",description:"Pronacja i supinacja przedramienia. Trzymaj młotek lub ciężarek w dłoni, łokieć zgięty 90 stopni przy ciele. Wykonuj rotację przedramienia, przenosząc ciężar z dłoni do góry do dłoni w dół. Ruch powolny i kontrolowany.",category:"strength",bodyPart:"elbow",difficulty:2,sets:3,reps:12,equipment:["dumbbell","hammer"],tags:["rotacja","przedramię","mobilność","siła"]},{id:"triceps-stretch-overhead",name:"Triceps Stretch Overhead",description:"Rozciąganie tricepsa nad głową. Unieś jedną rękę nad głowę, zegnij w łokciu tak, aby dłoń dotykała pleców między łopatkami. Drugą ręką delikatnie pociągnij łokieć głębiej. Utrzymaj rozciąganie.",category:"stretching",bodyPart:"elbow",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","triceps","mobilność","rehabilitacja"]},{id:"biceps-curl-isometric",name:"Biceps Curl Isometric",description:"Izometryczne zginanie bicepsa. Trzymaj ciężarek w dłoni, zegnij łokieć do 90 stopni. Utrzymaj pozycję statyczną przez określony czas. Napinaj biceps, ale nie wykonuj ruchu. Wzmacnia stabilność łokcia.",category:"strength",bodyPart:"elbow",difficulty:2,duration:20,equipment:["dumbbell"],tags:["izometryczne","biceps","stabilizacja","siła"]},{id:"elbow-mobilization",name:"Elbow Mobilization",description:"Mobilizacja stawu łokciowego. Siedząc przy stole, oprzyj przedramię o powierzchnię. Wykonuj delikatne ruchy ślizgowe przedramienia w przód i w tył, jednocześnie lekko dociskając do stołu. Poprawia poślizg w stawie.",category:"mobility",bodyPart:"elbow",difficulty:1,sets:2,reps:20,equipment:[],tags:["mobilizacja","staw łokciowy","poślizg","rehabilitacja"]},{id:"neck-rotation",name:"Neck Rotation",description:"Rotacja szyi. Siedząc prosto, powoli obracaj głowę w prawo, patrząc przez ramię. Utrzymaj pozycję, czując rozciąganie po lewej stronie szyi. Powróć na środek i powtórz w drugą stronę. Ruch powolny, bez szarpnięć.",category:"mobility",bodyPart:"neck",difficulty:1,sets:2,reps:10,equipment:[],tags:["mobilność","rotacja","szyja","rozciąganie"]},{id:"neck-side-flexion",name:"Neck Side Flexion",description:"Boczne zgięcie szyi. Siedząc prosto, pochyl głowę w prawo, starając się przybliżyć ucho do ramienia. Lewe ramię utrzymaj nisko. Możesz delikatnie wspomóc ręką. Utrzymaj rozciąganie. Powtórz na drugą stronę.",category:"stretching",bodyPart:"neck",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","boczne zgięcie","mięsień dźwigacz","szyja"]},{id:"chin-tucks",name:"Chin Tucks",description:'Wciąganie brody (retrakcja). Siedząc prosto, wciśnij brodę do tyłu jakbyś chciał zrobić "drugi podbródek". Wytrzymaj 3-5 sekund, czując napięcie głębokich mięśni szyi. Rozluźnij i powtórz. Neutralizuje postawę wysuniętą.',category:"strength",bodyPart:"neck",difficulty:1,sets:3,reps:10,equipment:[],tags:["postawa","retrakcja","głębokie mięśnie","szpadel"]},{id:"upper-trap-stretch",name:"Upper Trap Stretch",description:"Rozciąganie górnego części mięśnia czworobocznego. Siedząc, chwyć prawą ręką krzesło dla stabilizacji. Pochyl głowę w lewo i lekko obróć w prawo. Czuj rozciąganie od szyi do barku. Utrzymaj i powtórz drugą stronę.",category:"stretching",bodyPart:"neck",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","czworoboczny","bark","napięcie"]},{id:"levator-scapulae-stretch",name:"Levator Scapulae Stretch",description:"Rozciąganie mięśnia dźwigacza łopatki. Siedząc, pochyl głowę w prawo i obróć w lewo (patrz pod pachę). Prawą ręką delikatnie pociągnij głowę głębiej. Czuj rozciąganie w kącie szyi i łopatki. Powtórz drugą stronę.",category:"stretching",bodyPart:"neck",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","dźwigacz łopatki","szyja","łopatka"]},{id:"neck-isometric-holds",name:"Neck Isometric Holds",description:"Izometryczne napięcia mięśni szyi. Przyłóż dłoń do czoła, skroni lub tyłu głowy. Dociskaj głowę do dłoni, ale nie wykonuj ruchu. Utrzymuj napięcie przez 5-10 sekund. Powtórz w wszystkich kierunkach.",category:"strength",bodyPart:"neck",difficulty:2,sets:3,reps:5,equipment:[],tags:["izometryczne","siła","stabilizacja","głębokie mięśnie"]},{id:"terminal-knee-extension",name:"Terminal Knee Extension",description:"Końcowe wyprostowanie kolana. Siedząc z ugiętym kolanem, postaw stopę na podłodze. Aktywuj mięsień czworogłowy, dociskając kolano w dół i prostując nogę w ostatnich 30 stopniach zakresu. Utrzymaj pełny wyprost.",category:"strength",bodyPart:"knee",difficulty:1,sets:3,reps:15,equipment:[],tags:["quadriceps","końcowy zakres","siła","kontrola"]},{id:"patellar-mobilization",name:"Patellar Mobilization",description:"Mobilizacja rzepki. Siedząc z wyprostowaną nogą, zrelaksuj mięśnie uda. Dłońmi delikatnie chwyć rzepkę i przesuwaj ją w górę, w dół i na boki. Ruchy płynne, bez bólu. Poprawia mobilność rzepki.",category:"mobility",bodyPart:"knee",difficulty:1,sets:2,reps:20,equipment:[],tags:["mobilizacja","rzepka","poślizg","rehabilitacja"]},{id:"eccentric-squats",name:"Eccentric Squats",description:"Ekscentryczne przysiady. Wykonaj powolny przysiad (3-5 sekund w dół), kontrolując ruch. W górę wstań szybciej lub z pomocą rąk. Obciążenie na fazę ekscentryczną wzmacnia ścięgna i mięśnie wokół kolana.",category:"strength",bodyPart:"knee",difficulty:3,sets:3,reps:8,equipment:[],tags:["ekscentryczne","tendinopatia","siła","kontrola"]},{id:"side-lying-clam-advanced",name:"Side-Lying Clam Advanced",description:"Zaawansowane skorupki. Połóż się na boku z ugiętymi kolanami, stopy złączone. Z gumą oporową na udach, unieś górne kolano rotując biodro. Utrzymaj górę 2 sekundy, powoli opuść. Zaawansowana wersja clamshells.",category:"strength",bodyPart:"knee",difficulty:2,sets:3,reps:12,equipment:["resistance band"],tags:["pośladkowy średni","stabilizacja","guma oporowa","siła"]},{id:"sleeper-stretch",name:"Sleeper Stretch",description:"Rozciąganie w pozycji sleeping. Połóż się na boku, rękę zgiętą pod kątem 90 stopni ułożoną przed sobą. Drugą ręką delikatnie dociskaj przedramię w dół do podłogi. Czuj rozciąganie w tylnej części torebki barku.",category:"stretching",bodyPart:"shoulder",difficulty:2,duration:30,equipment:[],tags:["rozciąganie","torebka tylna","mobilność","konflikt"]},{id:"cross-body-stretch",name:"Cross-Body Stretch",description:"Rozciąganie przez klatkę piersiową. Przenieś rękę przed klatkę piersiową, łokieć lekko zgięty. Drugą ręką przyciągnij łokieć bliżej ciała. Czuj rozciąganie w tylnej części barku i łopatce.",category:"stretching",bodyPart:"shoulder",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","tylna część barku","mięsień podgrzebieniowy"]},{id:"empty-can-raises",name:"Empty Can Raises",description:"Unoszenie ramion (empty can). Wyprostuj ramię, kciuk skierowany w dół (jak wylewanie puszki). Unoś rękę do góry w płaszczyźnie łopatki do około 45 stopni. Powoli opuść. Izoluje nadgrzebieniowy.",category:"strength",bodyPart:"shoulder",difficulty:2,sets:3,reps:12,equipment:["dumbbell"],tags:["nadgrzebieniowy","stożki rotatory","siła","izolacja"]},{id:"prone-y-raises",name:"Prone Y Raises",description:"Unoszenie ramion w Y na brzuchu. Połóż się na brzuchu, ramiona wyprostowane w pozycji litery Y nad głową. Kciuki skierowane w górę. Unoś ramiona od podłogi, napinając dolny czworoboczny. Powoli opuść.",category:"strength",bodyPart:"shoulder",difficulty:2,sets:3,reps:12,equipment:[],tags:["dolny czworoboczny","stabilizacja łopatki","postawa","siła"]},{id:"dead-bug",name:"Dead Bug",description:"Martwy robak. Leżąc na plecach, ramiona wyprostowane w górze, nogi ugięte w górze pod kątem 90 stopni. Dociskaj odcinek lędźwiowy do podłogi. Powoli opuszczaj naprzemiennie rękę i przeciwną nogę, utrzymując stabilność.",category:"strength",bodyPart:"spine",difficulty:2,sets:3,reps:10,equipment:[],tags:["core","stabilizacja","mięśnie głębokie","kontrola"]},{id:"thoracic-rotation",name:"Thoracic Rotation",description:"Rotacja piersiowego odcinka kręgosłupa. W klęku podpartym, jedna ręka za głową. Obróć tułów w stronę łokcia, potem sięgnij łokciem pod ciało. Płynny ruch z kontrolą oddechu. Powtórz drugą stronę.",category:"mobility",bodyPart:"spine",difficulty:1,sets:2,reps:10,equipment:[],tags:["mobilność","odcinek piersiowy","rotacja","kręgosłup"]},{id:"prone-extension",name:"Prone Extension",description:"Wyprost w leżeniu na brzuchu. Połóż się na brzuchu, ramiona wzdłuż tułowia. Unieś klatkę piersiową od podłogi, napinając mięśnie grzbietu. Wytrzymaj górną pozycję, potem powoli opuść. Wzmacnia prostowniki.",category:"strength",bodyPart:"spine",difficulty:2,sets:3,reps:12,equipment:[],tags:["prostowniki","siła","postawa","grzbiet"]},{id:"child-pose",name:"Child Pose",description:"Pozycja dziecka. Z klęku usiądź na piętach, ręce wyciągnij daleko przed siebie na podłodze. Pozwól czołu opaść na matę. Oddychaj głęboko w plecy, pozwalając kręgosłupowi się rozciągnąć i zrelaksować.",category:"stretching",bodyPart:"spine",difficulty:1,duration:60,equipment:[],tags:["rozciąganie","relaksacja","kręgosłup","joga"]},{id:"figure-4-stretch",name:"Figure 4 Stretch",description:"Rozciąganie w pozycji figury 4. Leżąc na plecach, połóż kostkę jednej nogi na kolanie drugiej (figura 4). Chwyć udo nogi podporowej i przyciągnij do klatki. Czuj rozciąganie w pośladku i biodrze.",category:"stretching",bodyPart:"hip",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","pośladek","mięsień gruszkowaty","biodro"]},{id:"90-90-stretch",name:"90/90 Stretch",description:"Rozciąganie 90/90. Siedząc na podłodze, jedna noga z przodu zgięta pod 90 stopni, druga z boku też pod 90 stopni. Pochyl się nad przednią nogą, potem obróć nad boczną. Rozciąga biodra w różnych kierunkach.",category:"stretching",bodyPart:"hip",difficulty:2,duration:45,equipment:[],tags:["rozciąganie","mobilność bioder","rotacja","elastyczność"]},{id:"fire-hydrants",name:"Fire Hydrants",description:"Unoszenie kolana na bok (hydrant). W klęku podpartym, unoś jedno kolano w bok i w górę, rotując biodro. Utrzymaj prosty kąt w kolanie. Powoli wróć do pozycji. Wzmacnia pośladkowy średni i stabilizację biodra.",category:"strength",bodyPart:"hip",difficulty:1,sets:3,reps:12,equipment:[],tags:["pośladkowy średni","odwodzenie","siła","stabilizacja"]},{id:"standing-hip-flexor-stretch",name:"Standing Hip Flexor Stretch",description:"Rozciąganie zginaczy biodra w staniu. Wykonaj wykrok, tylne kolano lekko dotyka podłogi. Przesuń biodra lekko w przód, trzymając tułów wyprostowany. Czuj rozciąganie z przodu biodra tylnej nogi. Unieś rękę tej strony.",category:"stretching",bodyPart:"hip",difficulty:1,duration:30,equipment:[],tags:["rozciąganie","zginacze biodra","mobilność","stanie"]},{id:"towel-scrunch",name:"Towel Scrunch",description:"Ściskanie ręcznika palcami. Połóż ręcznik na podłodze, usiądź na krześle. Stopą ściskaj i przyciągaj ręcznik palcami, kurczając stopę. Wzmacnia mięśnie stopy i łuku podłużnego.",category:"strength",bodyPart:"ankle",difficulty:1,sets:3,reps:15,equipment:["towel"],tags:["mięśnie stopy","łuk podłużny","siła","kontrola"]},{id:"marble-pickup",name:"Marble Pickup",description:"Zbieranie kulek palcami. Rozsyp małe kulki lub przedmioty na podłodze. Siedząc, podnoś je palcami stopy i przenoś do pojemnika. Precyzyjne ćwiczenie wzmacniające mięśnie stopy i koordynację.",category:"strength",bodyPart:"ankle",difficulty:1,sets:2,reps:20,equipment:["marbles"],tags:["siła stopy","koordynacja","precyzja","mięśnie stopy"]},{id:"eccentric-calf-raises",name:"Eccentric Calf Raises",description:"Ekscentryczne wspięcia na palce. Stojąc na krawędzi stopnia, wspinaj się na palce obunóż (faza koncentryczna). Następnie powoli (3-5 sekund) opuszczaj się na jednej nodze. Zmień nogę. Kluczowe na tendinopatię Achillesa.",category:"strength",bodyPart:"ankle",difficulty:3,sets:3,reps:10,equipment:["step"],tags:["ekscentryczne","Achilles","tendinopatia","łydki"]},{id:"ankle-eversion",name:"Ankle Eversion",description:"Ewersja stopy z gumą. Siedząc, zaczep gumę o stopę i przytrzymaj. Obracaj stopę na zewnątrz (mały palec odchyla się w bok), pokonując opór. Wzmacnia mięśnie strzałkowe, ważne przy skręceniach.",category:"strength",bodyPart:"ankle",difficulty:1,sets:3,reps:15,equipment:["resistance band"],tags:["ewersja","mięśnie strzałkowe","siła","skręcenie"]},{id:"it-band-stretch",name:"IT Band Stretch",description:"Rozciąganie pasma biodrowo-piszczelowego. Stojąc, skrzyżuj nogi (prawa za lewą). Pochyl tułów w lewo, wyciągając rękę nad głowę. Czuj rozciąganie po zewnętrznej stronie prawego uda. Powtórz drugą stronę.",category:"stretching",bodyPart:"hip",difficulty:2,duration:30,equipment:[],tags:["ITB","pasmo biodrowo-piszczelowe","rozciąganie","biegacze"]},{id:"single-leg-deadlift",name:"Single Leg Deadlift",description:"Martwy ciąg na jednej nodze. Stojąc na jednej nodze, pochyl tułów w przód, drugą nogę wyciągając w tył. Utrzymuj proste plecy i lekko ugięte kolano stojącej nogi. Wzmacnia tylną taśmę i równowagę.",category:"strength",bodyPart:"hip",difficulty:3,sets:3,reps:8,equipment:["dumbbell"],tags:["tylna taśma","równowaga","siła","funkcjonalne"]},{id:"prone-horizontal-abduction",name:"Prone Horizontal Abduction",description:"Odwodzenie w leżeniu na brzuchu. Leżąc na brzuchu, ramiona wyciągnięte na boki w poziomie. Kciuki skierowane w górę. Unoś ramiona od podłogi, napinając mięśnie międzyłopatkowe. Powoli opuść.",category:"strength",bodyPart:"shoulder",difficulty:2,sets:3,reps:12,equipment:[],tags:["mięśnie międzyłopatkowe","postawa","siła","grzbiet"]},{id:"foam-rolling-quads",name:"Foam Rolling Quads",description:"Rolowanie mięśnia czworogłowego. Połóż się na rollerze w podporze na przedramionach, roller pod udami. Przesuwaj się w górę i w dół ud, od miednicy do kolan. Zatrzymaj się na bolesnych punktach na 30 sekund.",category:"stretching",bodyPart:"knee",difficulty:1,duration:90,equipment:["foam roller"],tags:["SMR","rolowanie","quadriceps","rozluźnianie"]},{id:"foam-rolling-calves",name:"Foam Rolling Calves",description:"Rolowanie łydek. Usiądź na podłodze, roller pod łydkami. Ręce w podporze z tyłu. Przesuwaj się w górę i w dół łydek, od kostek do kolan. Możesz nałożyć jedną nogę na drugą dla większego nacisku.",category:"stretching",bodyPart:"ankle",difficulty:1,duration:90,equipment:["foam roller"],tags:["SMR","rolowanie","łydki","rozluźnianie"]},{id:"standing-back-extension",name:"Standing Back Extension",description:"Wyprost pleców w staniu. Stojąc, ręce na dole pleców. Pochyl się lekko w tył, wyginając kręgosłup lędźwiowy. Wytrzymaj pozycję, czując napięcie w dolnej części pleców. Powtórz płynnie.",category:"mobility",bodyPart:"spine",difficulty:1,sets:2,reps:10,equipment:[],tags:["mobilność","lędźwia","wyprost","kręgosłup"]},{id:"resisted-ankle-inversion",name:"Resisted Ankle Inversion",description:"Inwersja stopy z gumą. Siedząc, zaczep gumę o stopę i przytrzymaj. Obracaj stopę do wewnątrz (duży palec zbliża się do drugiej stopy), pokonując opór. Wzmacnia mięśnie przyśrodkowe, ważne przy skręceniach.",category:"strength",bodyPart:"ankle",difficulty:1,sets:3,reps:15,equipment:["resistance band"],tags:["inwersja","mięśnie przyśrodkowe","siła","skręcenie"]},{id:"scapular-retraction",name:"Scapular Retraction",description:"Retrakcja łopatek. Siedząc lub stojąc z wyprostowanymi plecami, ściągaj łopatki do siebie i w dół, jakbyś chciał je połączyć. Utrzymaj 5 sekund, czując napięcie między łopatkami. Rozluźnij i powtórz.",category:"strength",bodyPart:"shoulder",difficulty:1,sets:3,reps:15,equipment:[],tags:["retrakcja","łopatki","postawa","mięśnie grzbietu"]},{id:"prone-w-y-t",name:"Prone W-Y-T",description:"Ćwiczenie W-Y-T na brzuchu. Leżąc na brzuchu, unoś ramiona w pozycji W (łokcie zgięte), Y (ramiona w górze na boki) i T (ramiona na boki). Każda pozycja 5 sekund. Wzmacnia całą taśmę tylną barku.",category:"strength",bodyPart:"shoulder",difficulty:2,sets:3,reps:8,equipment:[],tags:["taśma tylna","stabilizacja łopatki","postawa","siła"]}],f={strength:3,stretching:2,mobility:2,balance:1},p={1:1,2:2,3:3},m={knee:"Kolano",shoulder:"Bark",spine:"Kręgosłup",hip:"Biodro",ankle:"Skokowy / stopa",wrist:"Nadgarstek",elbow:"Łokieć",neck:"Szyja"},h={1:{name:"Ostra",desc:"kontrola bólu, wczesna mobilizacja"},2:{name:"Przebudowa",desc:"odbudowa siły i zakresu ruchu"},3:{name:"Funkcjonalna",desc:"powrót do aktywności"}},g=[["resistance band","Taśma oporowa"],["dumbbell","Hantle"],["step","Stopień"],["bench","Ławka"],["foam roller","Roller"],["towel","Ręcznik"],["marbles","Drobne przedmioty"],["stress ball","Piłka antystres."],["grip strengthener","Ściskacz"],["hammer","Młotek / hantelka"]],y={strength:"SIŁA",stretching:"STRETCHING",mobility:"MOBILNOŚĆ",balance:"RÓWNOWAGA"},b="rehab-offline-v1",k=e=>d.find(t=>t.id===e),w=()=>Math.random().toString(36).slice(2,10);(0,s.createRoot)(document.getElementById("root")).render((0,o.jsx)(l.StrictMode,{children:(0,o.jsx)(function(){let e,[t,n]=(0,l.useState)("gen"),[r,a]=(0,l.useState)("knee"),[i,s]=(0,l.useState)("pfps"),[v,z]=(0,l.useState)(2),[x,S]=(0,l.useState)(3),[j,P]=(0,l.useState)(["resistance band","towel"]),[E,C]=(0,l.useState)(2),[N,_]=(0,l.useState)(null),[T,L]=(0,l.useState)([]),[R,O]=(0,l.useState)
